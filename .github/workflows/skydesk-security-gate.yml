name: SkyDesk security gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject committed secrets and nested repositories
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -path './.git' -prune -o -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -iname '*token*.json' -o -iname '*credential*.json' \) -print)
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          nested=$(find . -mindepth 2 -type d -name .git -print)
          if [ -n "$nested" ]; then echo "$nested"; exit 1; fi
      - name: Reject high-confidence credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI '(gsk_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- ':!*.example' ':!docs/**'; then
            echo 'Potential credential detected'; exit 1
          fi
